[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge-student-mvp"
version = "0.0.1"
description = "Student-built financial research investigator — incomplete learning scaffold"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "langgraph>=0.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
